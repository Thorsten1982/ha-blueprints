Blueprint:
  name: Dynamische Lüftung (AH- & r.F.-basiert, Optimiert v3)
  description: >
    Berechnet die absolute Feuchtigkeit (AH) nach der Magnus-Formel und empfiehlt 
    Stoßlüften, wenn die Außenluft trockener ist als die Innenluft UND die relative 
    Innenfeuchtigkeit den gewählten Schwellenwert überschreitet.
  source_url: https://github.com/Thorsten1982/ha-blueprints/blob/main/dynamic_ventilation_optimized.yaml
  domain: automation

  input:
    temp_inside:
      name: Sensor Innen-Temperatur
      selector:
        entity:
          domain: sensor
          multiple: false
    rh_inside:
      name: Sensor Innen-Luftfeuchtigkeit
      selector:
        entity:
          domain: sensor
          multiple: false
    temp_outside:
      name: Sensor Außen-Temperatur
      selector:
        entity:
          domain: sensor
          multiple: false
    rh_outside:
      name: Sensor Außen-Luftfeuchtigkeit
      selector:
        entity:
          domain: sensor
          multiple: false
    state_helper:
      name: Helfer-Toggle (input_boolean)
      description: Erstellen Sie einen input_boolean-Helfer für diesen Raum, um den Lüftungszustand zu verfolgen.
      selector:
        entity:
          domain: input_boolean
          multiple: false
    notify_push:
      name: Push-Benachrichtigungsdienst (z.B. notify.mobile_app_your_phone oder notify.familie)
      selector:
        text:
          multiple: false
          multiline: false
    notify_tts:
      name: (Optional) TTS-Dienst (z.B. notify.alexa_media_kitchen)
      default: ''
      selector:
        text:
          multiple: false
          multiline: false
    room_name:
      name: Raumname (für Nachrichten)
      selector:
        text:
          multiple: false
          multiline: false

    rh_trigger:
      name: Mindest-Innenfeuchte für ÖFFNEN (% r.F.)
      description: Erst wenn die relative Feuchte innen diesen Wert überschreitet, wird gelüftet.
      default: 60.0
      selector:
        number:
          min: 45.0
          max: 80.0
          step: 1.0
          unit_of_measurement: '%'
          mode: slider

    rh_target:
      name: Ziel-Innenfeuchte für SCHLIESSEN (% r.F.)
      description: Lüften ist auch beendet, wenn die relative Feuchte innen unter diesen Wert fällt.
      default: 55.0
      selector:
        number:
          min: 40.0
          max: 75.0
          step: 1.0
          unit_of_measurement: '%'
          mode: slider

    threshold:
      name: Schwellenwert AH-Differenz (ÖFFNEN)
      description: Lüften empfohlen, wenn die AH-Differenz (Innen-Außen) diesen Wert überschreitet.
      default: 2.0
      selector:
        number:
          min: 0.5
          max: 10.0
          step: 0.1
          unit_of_measurement: g/m³
          mode: slider

    close_threshold:
      name: Schwellenwert AH-Differenz (SCHLIESSEN/Ziel)
      description: Lüftungsziel erreicht, wenn die AH-Differenz auf diesen Wert oder niedriger sinkt.
      default: 1.0
      selector:
        number:
          min: 0.1
          max: 9.9
          step: 0.1
          unit_of_measurement: g/m³
          mode: slider

    window_state_sensor:
      name: Fenster-Sensor (Optional)
      description: Binärer Sensor (z.B. Fensterkontakt). Verhindert unnötige Benachrichtigungen.
      default: ''
      selector:
        entity:
          domain: binary_sensor
          multiple: false

    presence_entity:
      name: Anwesenheits-Entität (Optional)
      description: Nur Benachrichtigung senden, wenn diese Entität 'on' oder 'home' ist.
      default: ''
      selector:
        entity:
          multiple: false

    active_time_start:
      name: Benachrichtigungszeitraum (Start HH:MM)
      description: Ab dieser Uhrzeit sind "Öffnen"-Benachrichtigungen aktiv.
      default: '07:00'
      selector:
        text:

    active_time_end:
      name: Benachrichtigungszeitraum (Ende HH:MM)
      description: Bis zu dieser Uhrzeit sind "Öffnen"-Benachrichtigungen aktiv.
      default: '22:00'
      selector:
        text:

    min_temp_outside:
      name: Mindest-Außentemperatur für Lüften (°C)
      description: Verhindert "Öffnen"-Meldungen bei zu kalten Außentemperaturen.
      default: 3.0
      selector:
        number:
          min: -20.0
          max: 10.0
          step: 0.1
          unit_of_measurement: °C
          mode: slider

    message_ventilate:
      name: Nachricht bei Lüftungsempfehlung
      default: '{{ room_name }}: Hohe Feuchtigkeit! Stoßlüften ist notwendig.'

    message_close:
      name: Nachricht bei Lüftungsziel erreicht
      default: 'Lüftungsziel im {{ room_name }} erreicht. Fenster kann geschlossen werden.'

trigger:
  - platform: time_pattern
    minutes: /5

condition:
  - condition: template
    value_template: '{{ have_valid_data }}'

variables:
  temp_inside_entity: !input temp_inside
  rh_inside_entity: !input rh_inside
  temp_outside_entity: !input temp_outside
  rh_outside_entity: !input rh_outside
  state_helper_entity: !input state_helper
  room_name: !input room_name
  rh_trigger: !input rh_trigger
  rh_target: !input rh_target
  threshold: !input threshold
  close_threshold: !input close_threshold
  window_sensor_entity: !input window_state_sensor
  presence_entity: !input presence_entity
  active_time_start: !input active_time_start
  active_time_end: !input active_time_end
  min_temp_outside: !input min_temp_outside
  notify_push: !input notify_push
  notify_tts: !input notify_tts
  message_ventilate: !input message_ventilate
  message_close: !input message_close

  have_valid_data: >
    {{ states(temp_inside_entity) not in ['unknown','unavailable','none','']
       and states(temp_outside_entity) not in ['unknown','unavailable','none','']
       and states(rh_inside_entity) not in ['unknown','unavailable','none','']
       and states(rh_outside_entity) not in ['unknown','unavailable','none',''] }}

  e_const: 2.718281828459045
  t_in: "{{ states(temp_inside_entity) | float(0) }}"
  rh_in: "{{ states(rh_inside_entity) | float(0) }}"
  t_out: "{{ states(temp_outside_entity) | float(0) }}"
  rh_out: "{{ states(rh_outside_entity) | float(0) }}"

  # Absolute Feuchtigkeit (g/m³) nach Magnus-Formel
  af_in: >
    {{ 216.7 * ((rh_in / 100) * (6.112 * (e_const ** ((17.62 * t_in) / (243.12 + t_in))))) / (273.15 + t_in) }}
  af_out: >
    {{ 216.7 * ((rh_out / 100) * (6.112 * (e_const ** ((17.62 * t_out) / (243.12 + t_out))))) / (273.15 + t_out) }}
  
  delta_af: "{{ af_in - af_out }}"
  delta_rh: "{{ rh_in - rh_out }}"

  # KORREKTUR: Lüften nur, wenn AH-Differenz vorhanden IST UND r.F. innen über dem Schwellenwert liegt
  ventilation_needed_to_open: >
    {{ (delta_af | float(0)) > (threshold | float(0)) and (rh_in | float(0)) >= (rh_trigger | float(60)) }}

  # KORREKTUR: Schließen, wenn AH-Differenz erreicht IST ODER r.F. innen bereits ausreichend gesunken ist
  air_is_ok_to_close: >
    {{ (delta_af | float(0)) <= (close_threshold | float(0)) or (rh_in | float(0)) <= (rh_target | float(55)) }}

  window_is_closed: >
    {{ window_sensor_entity == '' or is_state(window_sensor_entity, 'off') or is_state(window_sensor_entity, 'closed') }}

  is_someone_home: >
    {{ presence_entity == '' or is_state(presence_entity, 'on') or is_state(presence_entity, 'home') }}

  is_active_time: >
    {% set current_time = now().time().strftime('%H:%M') %}
    {{ current_time >= active_time_start and current_time < active_time_end }}

  is_not_too_cold: "{{ (t_out | float(-99)) >= (min_temp_outside | float(0)) }}"
  helper_is_on: "{{ is_state(state_helper_entity, 'on') }}"

  title_open: "🪟 Fenster öffnen — {{ room_name }}"
  title_close: "🚪 Fenster schließen — {{ room_name }}"

action:
  - choose:
      # AKTION 1: FENSTER ÖFFNEN (Empfehlung)
      - conditions:
          - condition: template
            value_template: >
              {{ ventilation_needed_to_open
                 and not helper_is_on
                 and window_is_closed 
                 and is_someone_home 
                 and is_active_time  
                 and is_not_too_cold  
              }}
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: !input state_helper
          - action: "{{ notify_push }}"
            data:
              title: "{{ title_open }}"
              message: >
                {{ message_ventilate }}

                Innen: {{ rh_in | round(0) }}%, {{ af_in | round(1) }} g/m³ — {{ t_in | round(1) }}°C

                Außen: {{ rh_out | round(0) }}%, {{ af_out | round(1) }} g/m³ — {{ t_out | round(1) }}°C

                ΔAH = {{ delta_af | round(1) }} g/m³ (Öffnen bei {{ threshold | round(1) }})
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (notify_tts | default('')) | string != '' }}"
                sequence:
                  - action: "{{ notify_tts }}"
                    data:
                      message: "{{ message_ventilate }}"

      # AKTION 2: FENSTER SCHLIESSEN (Ziel erreicht)
      - conditions:
          - condition: template
            value_template: "{{ air_is_ok_to_close and helper_is_on }}"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input state_helper
          - action: "{{ notify_push }}"
            data:
              title: "{{ title_close }}"
              message: >
                {{ message_close }}

                Innen: {{ rh_in | round(0) }}%, {{ af_in | round(1) }} g/m³ — {{ t_in | round(1) }}°C

                Außen: {{ rh_out | round(0) }}%, {{ af_out | round(1) }} g/m³ — {{ t_out | round(1) }}°C

                ΔAH = {{ delta_af | round(1) }} g/m³ (Ziel: {{ close_threshold | round(1) }})
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (notify_tts | default('')) | string != '' }}"
                sequence:
                  - action: "{{ notify_tts }}"
                    data:
                      message: "{{ message_close }}"

      # AKTION 3: MANUELLES SCHLIESSEN (Reset des Helfers bei geschlossenem Fenster)
      - conditions:
          - condition: template
            value_template: >
              {{ helper_is_on 
                 and window_sensor_entity != '' 
                 and (is_state(window_sensor_entity, 'off') or is_state(window_sensor_entity, 'closed'))
                 and not air_is_ok_to_close 
              }}
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input state_helper

mode: single
