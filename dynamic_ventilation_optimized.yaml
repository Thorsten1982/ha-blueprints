blueprint:
  name: Test Blueprint Minimal
  description: Minimaler Test zum Prüfen des Blueprint-Imports
  domain: automation
  input:
    test_helper:
      name: Test-Schalter (input_boolean)
      selector:
        entity:
          domain: input_boolean

trigger:
  - platform: state
    entity_id: !input test_helper
    to: "on"

action:
  - action: input_boolean.turn_off
    target:
      entity_id: !input test_helper
